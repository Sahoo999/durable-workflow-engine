services:
  postgres:
    image: postgres:16
    container_name: workflow-postgres
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: workflow-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: